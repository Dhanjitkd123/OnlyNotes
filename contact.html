<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us – OnlyNotes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- This script syncs the theme with the main page BEFORE it renders -->
    <script>
        tailwind.config = { darkMode: 'class' };
        
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        window.addEventListener('storage', (event) => {
            if (event.key === 'color-theme') {
                if (event.newValue === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }
        });
    </script>
</head>
<body class="bg-[#F0F4F8] dark:bg-slate-900 text-slate-800 dark:text-slate-200 font-sans p-6 md:p-12 transition-colors duration-300">
    
    <main class="max-w-2xl mx-auto bg-white dark:bg-slate-800 p-8 md:p-12 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700 text-center transition-colors duration-300">
        <header class="mb-8 border-b border-slate-200 dark:border-slate-700 pb-6">
            <h1 class="text-3xl font-extrabold text-[#007BFF] dark:text-blue-400 mb-2">Contact Us</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400">OnlyNotes Support</p>
        </header>

        <div class="space-y-6 text-slate-600 dark:text-slate-300 leading-relaxed py-6">
            <p class="text-lg">
                If you have any questions, feedback, or need assistance with your OnlyNotes account, please feel free to reach out. We are here to help!
            </p>
            
            <div class="bg-slate-50 dark:bg-slate-700/50 p-8 rounded-xl border border-slate-100 dark:border-slate-600 mt-4 transition-colors">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">Email Address</h2>
                <a href="mailto:dhanjitkd123@gmail.com" class="text-2xl sm:text-3xl font-bold text-[#007BFF] dark:text-blue-400 hover:text-[#0056B3] dark:hover:text-blue-300 transition-colors break-all">
                    dhanjitkd123@gmail.com
                </a>
            </div>
        </div>

        <footer class="mt-10 pt-6 border-t border-slate-200 dark:border-slate-700 text-left">
            <a href="index.html" class="inline-flex items-center text-[#007BFF] dark:text-blue-400 hover:text-[#0056B3] dark:hover:text-blue-300 font-bold transition-colors">
                &larr; Back to OnlyNotes
            </a>
        </footer>
    </main>
    
</body>
</html>
